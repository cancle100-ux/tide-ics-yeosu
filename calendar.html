<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>거문도 출조 달력</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#0b1020; --cell:#121a2c; --cell2:#0e1526; --line:#22304d; --text:#e8edf7; --muted:#8a97b3;
    --wind:#ff5a5f; --wave:#3ddc84; --gust:#ffd166; --today:#5ec8ff;
    --good:rgba(46,204,113,.13); --ok:rgba(241,196,15,.13); --caution:rgba(230,126,34,.16); --bad:rgba(231,76,60,.2);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-weight:600;-webkit-font-smoothing:antialiased}
  header{padding:14px 14px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
  h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  h1 button{background:var(--cell);border:1px solid var(--line);color:var(--text);font:inherit;font-size:16px;width:34px;height:30px;cursor:pointer}
  .sub{font-size:12px;color:var(--muted)}
  .sub b{color:var(--text)}
  .legend{margin-left:auto;display:flex;gap:12px;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:5px}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px;font-size:11px;color:var(--muted);text-align:center}
  .dow span:nth-child(6){color:#8ab4ff}.dow span:nth-child(7){color:#ff8a8a}
  .grid{padding:4px 8px 20px}
  .week{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
  .cell{position:relative;height:var(--ch,124px);background:var(--cell);border:1px solid var(--line);padding:5px 6px;overflow:hidden;cursor:pointer}
  .cell.other{opacity:.35}
  .cell.today{border-color:var(--today);box-shadow:inset 0 0 0 1px var(--today)}
  .cell .d{font-size:14px;font-weight:800;line-height:1}
  .cell.sat .d{color:#8ab4ff}.cell.sun .d{color:#ff8a8a}
  .cell .tide{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .tide.star{color:#ffd166}
  .cell .wx{font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .wx b{font-weight:700}
  .cell .sum{position:absolute;left:6px;right:6px;bottom:4px;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;display:flex;justify-content:space-between}
  .cell .sum .w{color:var(--wind);font-weight:800}.cell .sum .v{color:var(--wave);font-weight:800}
  .cell .tier{position:absolute;top:5px;right:6px;font-size:10px;color:var(--muted)}
  svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .hint{padding:0 14px 28px;font-size:12px;color:var(--muted);line-height:1.6}
  .hint b{color:var(--text)}
  /* 상세 시트 */
  #sheet{position:fixed;left:0;right:0;bottom:0;max-height:70vh;overflow:auto;background:#0f172a;border-top:1px solid var(--line);box-shadow:0 -12px 40px #000a;transform:translateY(100%);transition:transform .2s;z-index:9;padding:14px 16px 24px}
  #sheet.on{transform:none}
  #sheet h2{margin:0 0 4px;font-size:18px;font-weight:800}
  #sheet .m{font-size:12px;color:var(--muted);margin-bottom:10px}
  #sheet table{width:100%;border-collapse:collapse;font-size:12.5px}
  #sheet th{color:var(--muted);font-weight:600;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
  #sheet td{text-align:right;padding:4px 6px;border-bottom:1px solid #1a2440;font-variant-numeric:tabular-nums}
  #sheet th:first-child,#sheet td:first-child{text-align:left}
  #sheet td.w{color:var(--wind);font-weight:800}#sheet td.v{color:var(--wave);font-weight:800}
  #sheet .close{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
  #sheet a{color:var(--today)}
  @media (max-width:560px){ :root{--ch:104px} .cell{padding:4px 4px} .cell .d{font-size:13px} .cell .tide,.cell .wx{font-size:10px} .cell .sum{font-size:9.5px} .legend{display:none} }
</style>
</head>

const Q = new URLSearchParams(location.search);
const LAT = parseFloat(Q.get('lat')||'34.0283'), LON = parseFloat(Q.get('lon')||'127.3086'), NAME = Q.get('name')||'거문도';
const TH = {good:5, ok:8, caution:11};
const PAST = 7, FUT = 16;
document.title = NAME + ' 출조 달력';
document.getElementById('glink').href = './' + (location.search||'');

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const ARR = ['↓','↙','←','↖','↑','↗','→','↘']; const arrow = d => d==null?'·':ARR[Math.floor(((d+22.5)%360)/45)];
const KDIR = ['북','북북동','북동','동북동','동','동남동','남동','남남동','남','남남서','남서','서남서','서','서북서','북서','북북서']; const kdir = d => d==null?'-':KDIR[Math.floor(((d+11.25)%360)/22.5)];
const WX = c => c==null?'':c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌧️':c<=86?'🌨️':'⛈️';
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const band = v => v==null?'': cssVar(v<=TH.good?'--good': v<=TH.ok?'--ok': v<=TH.caution?'--caution':'--bad');

let H = {};   // iso date -> {ws:[24], gust:[24], dir:[24], wave:[24]}
let DAILY = {}; // iso -> {code,tmax,tmin,pop}
let view = new Date(); view.setDate(1);

async function load(){
  const base = `latitude=${LAT}&longitude=${LON}&timezone=Asia%2FSeoul&past_days=${PAST}&forecast_days=${FUT}`;
  const [fc, mr] = await Promise.all([
    fetch(`https://api.open-meteo.com/v1/forecast?${base}&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&wind_speed_unit=ms`).then(r=>r.json()),
    fetch(`https://marine-api.open-meteo.com/v1/marine?${base}&hourly=wave_height`).then(r=>r.json()).catch(()=>null),
  ]);
  const h = fc.hourly, wv = mr?.hourly ? Object.fromEntries(mr.hourly.time.map((t,i)=>[t, mr.hourly.wave_height[i]])) : {};
  H = {};
  h.time.forEach((t,i)=>{ const k=t.slice(0,10), hr=+t.slice(11,13); (H[k] ||= {ws:Array(24).fill(null),gust:Array(24).fill(null),dir:Array(24).fill(null),wave:Array(24).fill(null)});
    H[k].ws[hr]=h.wind_speed_10m[i]; H[k].gust[hr]=h.wind_gusts_10m[i]; H[k].dir[hr]=h.wind_direction_10m[i]; H[k].wave[hr]=wv[t]??null; });
  DAILY = {}; const d = fc.daily; d.time.forEach((t,i)=>{ DAILY[t]={code:d.weather_code[i], tmax:d.temperature_2m_max[i], tmin:d.temperature_2m_min[i], pop:d.precipitation_probability_max[i]}; });
  const now=new Date(), k=iso(now), hr=now.getHours(), c=H[k];
  document.getElementById('nowline').innerHTML = c ? `지금 <b>${c.ws[hr]?.toFixed(1)}m/s ${arrow(c.dir[hr])}${kdir(c.dir[hr])}</b>${c.wave[hr]!=null?` · 파고 <b>${c.wave[hr].toFixed(1)}m</b>`:''} · ${TIDE[k]||''} · 갱신 ${now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}` : '';
  render();
}

function dayMax(k, key, h0=0, h1=24){ const c=H[k]; if(!c) return null; const v=c[key].slice(h0,h1).filter(x=>x!=null); return v.length?Math.max(...v):null; }

function render(){
  const grid = document.getElementById('grid'); grid.innerHTML='';
  const y=view.getFullYear(), m=view.getMonth();
  document.getElementById('mtitle').textContent = `${y}년 ${m+1}월`;
  const first = new Date(y,m,1); const startOff = (first.getDay()+6)%7;   // 월요일 시작
  const start = new Date(y,m,1-startOff);
  const todayK = iso(new Date());
  const wsMax = 16, wvMax = 2.5;
  for(let w=0; w<6; w++){
    const days = []; for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+w*7+i); days.push(d); }
    if(w===5 && days[0].getMonth()!==m) break;
    const row = document.createElement('div'); row.className='week';
    days.forEach((d,i)=>{
      const k=iso(d), cell=document.createElement('div'); const off=Math.round((new Date(k)-new Date(todayK))/864e5);
      cell.className = 'cell'+(d.getMonth()!==m?' other':'')+(k===todayK?' today':'')+(i===5?' sat':'')+(i===6?' sun':'');
      const dmax = dayMax(k,'ws',5,18), vmax = dayMax(k,'wave'), gmax=dayMax(k,'gust',5,18);
      if(dmax!=null) cell.style.background = `linear-gradient(${band(dmax)},${band(dmax)}), var(--cell)`;
      const tide = TIDE[k]||''; const star = /사리|조금/.test(tide);
      const wx = DAILY[k];
      cell.innerHTML = `<div class="d">${d.getDate()}</div>
        ${H[k]?`<div class="tier">${off<0?'':off<=3?'●':off<=7?'◐':'○'}</div>`:''}
        <div class="tide${star?' star':''}">${star?'⭐':''}${tide}</div>
        ${wx?`<div class="wx">${WX(wx.code)} <b>${Math.round(wx.tmin)}~${Math.round(wx.tmax)}°</b>${wx.pop!=null&&wx.pop>=30?` ☂${wx.pop}%`:''}</div>`:''}
        ${dmax!=null?`<div class="sum"><span class="w">💨${dmax.toFixed(0)}${gmax!=null?`<span style="color:var(--gust);font-weight:600">/${gmax.toFixed(0)}</span>`:''}</span>${vmax!=null?`<span class="v">〰${vmax.toFixed(1)}</span>`:''}</div>`:''}`;
      cell.addEventListener('click',()=>openSheet(k,d));
      row.appendChild(cell);
    });
    grid.appendChild(row);
    // --- 주 단위 오버레이 SVG (셀 경계를 넘어 이어지는 실선) ---
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','ov'); svg.setAttribute('preserveAspectRatio','none');
    const rowH = row.getBoundingClientRect().height || 124, W = 7000;   // viewBox 폭은 임의(가로 비율만 사용)
    svg.setAttribute('viewBox',`0 0 ${W} ${rowH}`);
    const cw = W/7, yTop = rowH*0.42, yBot = rowH-18;
    const path = (key, vmax, color, width, dash) => {
      let d='', pen=false;
      days.forEach((dd,i)=>{ const c=H[iso(dd)]; for(let hr=0;hr<24;hr++){ const v=c?c[key][hr]:null; if(v==null){pen=false;continue;} const x=cw*i+cw*(hr+0.5)/24, yy=yBot-(Math.min(v,vmax)/vmax)*(yBot-yTop); d+= (pen?'L':'M')+x.toFixed(1)+' '+yy.toFixed(1)+' '; pen=true; } });
      if(!d) return; const p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d',d); p.setAttribute('fill','none'); p.setAttribute('stroke',color); p.setAttribute('stroke-width',width); p.setAttribute('stroke-linejoin','round'); p.setAttribute('vector-effect','non-scaling-stroke'); if(dash) p.setAttribute('stroke-dasharray',dash); svg.appendChild(p);
    };
    // 임계선 (풍속 5/8/11)
    [[TH.good,'#2ecc71'],[TH.ok,'#f1c40f'],[TH.caution,'#e67e22']].forEach(([v,c])=>{ const yy=yBot-(v/wsMax)*(yBot-yTop); const l=document.createElementNS('http://www.w3.org/2000/svg','line'); l.setAttribute('x1',0); l.setAttribute('x2',W); l.setAttribute('y1',yy); l.setAttribute('y2',yy); l.setAttribute('stroke',c); l.setAttribute('stroke-opacity','.35'); l.setAttribute('stroke-dasharray','4 6'); l.setAttribute('vector-effect','non-scaling-stroke'); svg.appendChild(l); });
    path('gust', wsMax, cssVar('--gust'), 1.2, '4 4');
    path('wave', wvMax, cssVar('--wave'), 2.4);
    path('ws',   wsMax, cssVar('--wind'), 2.6);
    row.appendChild(svg);
  }
}

function openSheet(k, d){
  const c=H[k]; if(!c){ return; }
  document.getElementById('sh').textContent = `${d.getMonth()+1}/${d.getDate()} ${'일월화수목금토'[d.getDay()]} · ${TIDE[k]||''}`;
  const wx=DAILY[k]; document.getElementById('sm').innerHTML = `${wx?`${WX(wx.code)} ${Math.round(wx.tmin)}~${Math.round(wx.tmax)}°C${wx.pop!=null?` · 강수확률 ${wx.pop}%`:''} · `:''}낮 최대 풍속 <b>${dayMax(k,'ws',5,18)?.toFixed(1)??'-'}</b> m/s${dayMax(k,'wave')!=null?` · 최대 파고 <b>${dayMax(k,'wave').toFixed(1)}</b> m`:''} · <a href="./${location.search}">연속 그래프</a>`;
  let t='<table><tr><th>시각</th><th>풍속</th><th>돌풍</th><th>풍향</th><th>파고</th></tr>';
  for(let h=0;h<24;h+=2){ t+=`<tr><td>${String(h).padStart(2,'0')}시</td><td class="w">${c.ws[h]?.toFixed(1)??'-'}</td><td>${c.gust[h]?.toFixed(1)??'-'}</td><td>${arrow(c.dir[h])}${kdir(c.dir[h])}</td><td class="v">${c.wave[h]?.toFixed(1)??'-'}</td></tr>`; }
  document.getElementById('st').innerHTML = t+'</table>';
  document.getElementById('sheet').classList.add('on');
}
document.getElementById('close').onclick = ()=>document.getElementById('sheet').classList.remove('on');
document.getElementById('prev').onclick = ()=>{ view.setMonth(view.getMonth()-1); render(); };
document.getElementById('next').onclick = ()=>{ view.setMonth(view.getMonth()+1); render(); };
window.addEventListener('resize', ()=>render());
load().catch(e=>{ document.getElementById('nowline').textContent = '데이터 오류: '+e; render(); });
setInterval(()=>load().catch(()=>{}), 30*60*1000);
</script>
